[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["census", "ingest"]
relative_files = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]
